# Builds the Windows .exe files when a version tag is pushed (e.g. v1.0.0)
# and attaches them to a GitHub Release, so users never need Python.
#
#   git tag v1.0.0
#   git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # lets you run a test build from the Actions tab (no release is created)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build
        shell: cmd
        run: build.bat dist

      # Never publish an exe that can't open a vault: run the packaged app against the demo vault.
      - name: Self-test the packaged exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process dist\Vaultline.exe -ArgumentList '--selftest','demo\sample.kdbx' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Vaultline.exe self-test hung (an error dialog?)" }
          if ($p.ExitCode -ne 0) {
            Get-Content demo\sample.selftest-error.txt -ErrorAction SilentlyContinue
            throw "Vaultline.exe failed its self-test (exit $($p.ExitCode))"
          }
          $help = & dist\vaultline-cli.exe --help
          if ($LASTEXITCODE -ne 0) { throw "vaultline-cli.exe --help failed" }
          $help | Select-Object -First 2
          "Self-test passed"

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-FileHash dist\*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", ($lines -join "`n") + "`n")

      - uses: actions/upload-artifact@v4
        with:
          name: vaultline-windows
          path: |
            dist/Vaultline.exe
            dist/vaultline-cli.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Vaultline.exe
            dist/vaultline-cli.exe
            dist/SHA256SUMS.txt
