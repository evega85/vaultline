# Builds the Windows .exe files when a version tag is pushed (e.g. v1.0.0)
# and attaches them to a GitHub Release, so users never need Python.
#
#   git tag v1.0.0
#   git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # lets you run a test build from the Actions tab (no release is created)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build
        shell: cmd
        run: build.bat dist

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist\*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vaultline-windows
          path: |
            dist/Vaultline.exe
            dist/vaultline-cli.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Vaultline.exe
            dist/vaultline-cli.exe
            dist/SHA256SUMS.txt
