name: Bug report
description: Something doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        **Never paste passwords, one-time code secrets, card details or your `.kdbx` file here.** This page is public.
        To show a problem, use the demo vault (`demo/sample.kdbx`, password `demo123`) or a new test vault.

        For a **security** problem, don't use this form. Follow [SECURITY.md](https://github.com/evega85/vaultline/blob/main/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: Vaultline version
      description: The release you downloaded (for example 1.1.0), or the commit if you run from source.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example Windows 11 24H2. You can find it in Settings > System > About.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the demo vault
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error messages or screenshots. Check that they show no real entries first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no passwords, secrets, real vault files or personal entries.
          required: true
